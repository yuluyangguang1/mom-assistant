  <!-- 第 127 次（安全 · 纵深防御）：内容安全策略。
       纯静态、无后端、无第三方资源，故 default-src 锁到 'self' 即可；
       style-src 必须保留 'unsafe-inline'——全站大量内联 style= 属性（icons.js 36 处等）
       与打印窗口的内联 <style> 都依赖它。
       附带收益：script-src 'self'（不含 'unsafe-inline'）会连带禁用内联事件处理器，
       为「属性闭合逃逸」型注入再上一道锁（本轮已从源头修掉，这里作为兜底）。
       注意：本行必须在任何外部资源之前声明，且已针对 file:// 双击场景实测。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">

<body>
  <!-- 液态玻璃 SVG 滤镜定义（隐藏）：
       #liquidRim 细波浪位移，用于把玻璃边缘高光弯折成液态反光（全浏览器可见、轻位移不碍阅读）。
       #liquidRefract 用于首页玻璃折射天空（由 glass.js 注入，仅首页启用）。 -->
  <svg class="glass-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquidRim" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="1" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 真·全平台折射：用于 .grefract 的「背景镜像 canvas」。
           注意是普通 filter（非 backdrop-filter），Chrome/Edge/Firefox/Safari 全部支持；
           滤镜对背景镜像做「模糊 + 位移」，产生透过玻璃扭曲背景的液态折射效果。 -->
      <filter id="liquidRefract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="9" result="noise"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blurred"/>
        <feDisplacementMap in="blurred" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div id="app">
    <header class="app-header">
      <!-- 第 80 次：左上角=当前宝宝头像（多宝宝点按切换，单宝宝进设置）；
           右上角=设置齿轮（旧版右上角的天空大日期已并入问候卡日期行）。
           第 95 次：模块页返回按钮改为顶栏内的圆形图标（与齿轮同视觉语言），
           日期徽标也收进顶栏——二者此前 position:fixed 相对视口定位，
           宽屏/不同页宽下会脱离内容列漂移，现在随 sticky 顶栏与内容对齐。 -->
      <button id="avatarBtn" class="home-avatar" type="button" aria-label="切换宝宝 / 进入设置"></button>
      <div id="modDate" class="mod-date" aria-hidden="true"></div>
      <div id="hdrTitle" class="hdr-title" aria-hidden="true"></div>
      <button id="backBtn" class="header-back" type="button" aria-label="返回首页" hidden></button>
      <button id="settingsBtn" class="header-gear" type="button" aria-label="设置"></button>
    </header>

    <main id="view" class="view"></main>

    <nav id="tabbar" class="tabbar"></nav>

    <!-- 全局快捷记录 dock（展开式 FAB）：点「＋」展开一键快记动作，任意页面可用 -->
    <div id="quickDock">
      <div class="qd-actions" id="qdActions"></div>
      <button id="qdFab" class="qd-fab" type="button" aria-expanded="false" aria-label="快速记录">＋</button>
    </div>
  </div>

  <!-- 第 135 次：遮罩移到 #app 之外。
       原因：胶囊底栏带 backdrop-filter / transform，会为 fixed 子元素创建包含块，
       遮罩留在 #quickDock 里就只盖住那个小方块、盖不住全屏。
       对应 CSS 由 #quickDock.open .qd-mask 改为 body.qd-open .qd-mask。 -->
  <div id="qdMask" class="qd-mask" aria-hidden="true"></div>
