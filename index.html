  <!-- 第 127 次（安全 · 纵深防御）：内容安全策略。
       纯静态、无后端、无第三方资源，故 default-src 锁到 'self' 即可；
       style-src 必须保留 'unsafe-inline'——全站大量内联 style= 属性（icons.js 36 处等）
       与打印窗口的内联 <style> 都依赖它。
       附带收益：script-src 'self'（不含 'unsafe-inline'）会连带禁用内联事件处理器，
       为「属性闭合逃逸」型注入再上一道锁（本轮已从源头修掉，这里作为兜底）。
       注意：本行必须在任何外部资源之前声明，且已针对 file:// 双击场景实测。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.open-meteo.com https://air-quality-api.open-meteo.com https://geocoding-api.open-meteo.com https://api.bigdatacloud.net; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <!-- viewport：允许捏合缩放（WCAG 1.4.4）；输入框已是 16px，不会触发 iOS 聚焦自动放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- 第 275 次（真机：启动长时间白屏）：首帧关键样式内联。
       styles.css 有 377KB（gzip 后 106KB），下载 / 解析完之前 WebView 是白的；
       这里只放启动层要用的几条，让它在 styles.css 到达之前就是启动图那块深暖棕 + 图标。
       与 manifest background_color、theme-color、启动图同色 #221E1A（启动图不分深浅色，见 boot.js）。
       CSP 的 style-src 含 'unsafe-inline'，内联 <style> 允许；脚本仍然不内联。 -->
  <style>
    html.is-booting, html.is-booting body { background: #221E1A; margin: 0; }
    .boot { position: fixed; inset: 0; z-index: 9999; background: #221E1A; }
    .boot-c { position: absolute; left: 50%; top: var(--boot-y, 44%); transform: translate(-50%, -50%); text-align: center; }
    .boot-ico { position: relative; display: block; width: 112px; height: 112px; margin: 0 auto; }
    .boot-ico img { display: block; width: 112px; height: 112px; border-radius: 26px; }
    .boot-ico i { opacity: 0; }
    .boot-txt { display: block; width: 260px; height: 82px; margin: 0 auto; }
  </style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 第 262 次：去掉 apple-mobile-web-app-status-bar-style=black-translucent。

  <!-- 第 262 次：iOS 边缘取色锚点（空元素、只声明颜色不绘制），让系统用页面底色铺状态栏/底边，而不是盖模糊 -->
  <div class="edge-strip edge-strip-top" aria-hidden="true"></div>
  <div class="edge-strip edge-strip-bottom" aria-hidden="true"></div>
  <!-- 液态玻璃 SVG 滤镜定义（隐藏）：
       #liquidRim 细波浪位移，用于把玻璃边缘高光弯折成液态反光（全浏览器可见、轻位移不碍阅读）。
       #liquidRefract 用于首页玻璃折射天空（由 glass.js 注入，仅首页启用）。 -->
  <svg class="glass-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquidRim" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="1" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 真·全平台折射：用于 .grefract 的「背景镜像 canvas」。
           注意是普通 filter（非 backdrop-filter），Chrome/Edge/Firefox/Safari 全部支持；
           滤镜对背景镜像做「模糊 + 位移」，产生透过玻璃扭曲背景的液态折射效果。 -->
      <filter id="liquidRefract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="9" result="noise"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blurred"/>
        <feDisplacementMap in="blurred" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
